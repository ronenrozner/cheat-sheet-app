[package]
name = "cheat-sheet-app"
version = "0.1.0"
description = "Global-hotkey cheat-sheet HUD overlay (Linux first) — Tauri / Rust / Svelte"
authors = ["cheat-sheet-app contributors"]
license = "Apache-2.0"
repository = ""
edition = "2021"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
