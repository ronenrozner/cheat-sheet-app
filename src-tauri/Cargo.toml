[package]
name = "CheatSheet"
version = "0.1.0"
description = "Global-hotkey cheat-sheet HUD overlay — Tauri / Rust / Svelte"
authors = ["CheatSheet contributors"]
license = "Apache-2.0"
repository = ""
edition = "2021"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
include_dir = "0.6"
ureq = { version = "2", features = ["rustls"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-store = "2"
tauri-plugin-single-instance = "2"
notify = "8"

[features]
console = []
